# API Test Agent — default config.
#
# இந்த file git-ல போகுது. Real staging URL, real token — எதுவும் இங்க
# எழுதக்கூடாது. அவை `config.local.yaml`-ல (gitignored) போகணும்; அந்த file
# இதோட merge ஆகும், local-ல இருக்கற key வெல்லும்.
#
# `${VAR_NAME}` மாதிரி எழுதினா environment variable-ல இருந்து எடுக்கப்படும்.

# ---------------------------------------------------------------------------
# target
# ---------------------------------------------------------------------------

# Session 08-ல real staging URL config.local.yaml-ல வரும்.
base_url: "http://localhost:8080"

# `main.py list` / `run` default-ஆ படிக்கற spec. specs/ gitignored.
spec_path: "specs/openapi.json"

# NON-NEGOTIABLE RULE 1. base_url-ஓட host-ல இந்த substring இல்லைன்னா
# program GuardrailError-ஓட நிக்கும். காலியா / missing ஆ இருந்தாலும் நிக்கும்.
require_host_substring: "localhost"

# ---------------------------------------------------------------------------
# auth
# ---------------------------------------------------------------------------

auth:
  # none | bearer | header
  type: "none"
  # type: bearer  -> Authorization: Bearer <token>
  token: "${API_TEST_TOKEN}"
  # type: header  -> ஒரு custom header, உதா: X-API-Key
  header_name: "X-API-Key"

# ---------------------------------------------------------------------------
# request behaviour
# ---------------------------------------------------------------------------

timeout: 10            # seconds, connect + read
verify_tls: true
max_response_chars: 500  # இதுக்கு மேல response body truncate ஆகும்

# ⚠️ `Accept: application/json` னு மட்டும் வெச்சிருந்தா, CSV / file
# return பண்ற endpoint `406 Not Acceptable` கொடுக்கும் — அது API-ஓட
# குறை இல்ல, நம்ம header-ஓட குறை. அப்படி ஒரு false FAIL ஒரு endpoint-ல
# ஏற்கனவே வந்துச்சு (`/package-category-landmark/export`, text/csv).
# JSON-க்கு முன்னுரிமை, ஆனா மத்ததையும் ஏத்துக்கணும்.
default_headers:
  Accept: "application/json, text/plain, */*"

# ---------------------------------------------------------------------------
# health check — run ஆரம்பிக்கும் முன்னாடி ஒரு தடவ
# ---------------------------------------------------------------------------
#
# API செத்துக்கிடந்தா 60 cases ஓட்டி 60 FAIL வாங்கறதுல அர்த்தமில்ல — அந்த
# report API-யப் பத்தி ஒன்னும் சொல்லாது, படிக்க 10 நிமிஷம் வீணாகும்.
#
# `path` ஆ **200 வரும்னு உங்களுக்கு தெரிஞ்ச** ஒரு மலிவான endpoint-ஐ
# போடுங்க. 400-க்கு மேல எது வந்தாலும் (404, 401 உட்பட) unhealthy —
# path தப்பு, இல்ல auth உடைஞ்சிருக்கு. ரெண்டுமே நிறுத்த வேண்டிய காரணம்.
#
# `path: null` னா check skip ஆகும்.
health_check:
  path: null
  query: {}

# ---------------------------------------------------------------------------
# guardrails
# ---------------------------------------------------------------------------

# Session 10-ல POST சேர்க்கலாம். அது வரைக்கும் read-only மட்டும்.
allowed_methods:
  - GET
  - HEAD
  - OPTIONS

# NON-NEGOTIABLE RULE 2 — third-party APIs. Host-ல இதுல ஏதாவது ஒன்னு
# இருந்தா அந்த request நிக்கும்.
blocked_host_substrings:
  - stripe
  - amadeus
  - ypsilon
  - webbeds
  - paypal
  - razorpay
  - twilio
  - sendgrid
  - googleapis
  - amazonaws

# Staging-ல கூட தொடக்கூடாத paths. Python regex, case-insensitive.
#
# ⚠️ Check நடக்கறது **resolved** path மேல — `{petId}` எல்லாம் value-ஆ
# மாறின பிறகு. அதனால pattern-ல `/pets/{petId}` னு எழுதினா வேலை செய்யாது
# (`/pets/1`-ஓட match ஆகாது). `/pets/` னு எழுதுங்க.
blocked_path_patterns:
  - "/payment"
  - "/checkout"
  - "/refund"
  - "/webhook"
  - "/admin"
  - "/internal"
  # --- session 03, real spec-ஐ படிச்சப்புறம் சேர்த்தது ---
  # இந்த endpoints backend-ல இருந்து hotel supplier-க்கு போகுதுன்னு
  # பேரைப் பாத்தா தெரியுது. Staging backend-ஆ இருந்தாலும் supplier real-ஆ
  # இருக்கலாம் — RULE 2. Real booking / hold போட்டுடக்கூடாது.
  # `booking` — `/booking/book`, `/package-bookings` ரெண்டையும் பிடிக்கும்.
  # `/bookings` னு எழுதினா `-bookings` தப்பிச்சுடும்.
  - "booking"
  - "/sync"
  - "/purge"
